name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dearly
          POSTGRES_PASSWORD: dearly
          POSTGRES_DB: dearly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dearly -d dearly" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://dearly:dearly@localhost:5432/dearly
      SESSION_SECRET: ci-session-secret-not-for-production-use
      APP_URL: http://localhost:3000
      AI_PROVIDER: mock
      STORAGE_DRIVER: local
      STORAGE_PATH: ./.data/uploads
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec tsx prisma/seed.ts --reset
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dearly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
